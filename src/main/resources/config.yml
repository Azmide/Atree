# ╔═══════════════════════════════════════╗
# ║           Aztree Configuration        ║
# ║        Smart TreeCapitator Plugin     ║
# ╚═══════════════════════════════════════╝

prefix: "&e&lWC &d>> "

aztree:
  enabled: true
  require-sneak: true
  max-blocks: 100
  radius: 6
  max-distance: 6
  blocks-per-tick: 10
  cooldown: 2
  smart-detection: true

blacklisted-worlds:
  - world_nether
  - world_the_end

replant:
  enabled: true
  chance: 100

reminder:
  enabled: true
  interval: 5
  type: actionbar
  message: "&aWC ENABLED! &7(Sneak to use)"

effects:
  sound: true
  particle: true

messages:
  enable: "%prefix%&aAztree enabled!"
  disable: "%prefix%&cAztree disabled!"
  need-sneak: "%prefix%&eYou must sneak!"
  cooldown: "%prefix%&cWait &e%time% seconds&c!"
  not-tree: "%prefix%&cThis is not a tree!"
  blacklisted-world: "%prefix%&cAztree cannot be used in this world!"