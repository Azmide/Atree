name: ATree
version: ${project.version}
main: org.AzSofware.aTree.ATree
author: AzmiDe
api-version: '26.2'
folia-supported: false
description: Smart TreeCapitator plugin for Paper 26.2

commands:
  wc:
    description: Toggle TreeCapitator on/off
    usage: /wc
    aliases: [ woodcutter, treecap ]

  aztree:
    description: ATree plugin management
    usage: /aztree <reload>
    aliases: [ az ]

permissions:
  aztree.*:
    description: full access
    children:
      aztree.use: true
      aztree.reload: true

  aztree.use:
    description: toggle and use the TreeCapitator
    default: true
  aztree.reload:
    description: reload the ATree config
    default: op
